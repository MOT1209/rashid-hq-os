name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Increased from default 360 to 15 for faster failure detection
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint
        timeout-minutes: 5

      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 5

      # The Windows path issue (WINDOWS-PATH-ISSUE.md) is local-only; this
      # runner is Linux, where the suite runs fine.
      - name: Test
        run: npm test
        timeout-minutes: 3

      # Placeholder secrets: the build only needs these to exist, and no test
      # here talks to a real Supabase project.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-key-not-used-in-ci
          # Must be 32+ chars and NOT the Better Auth default. The build gate
          # only checks VERCEL_ENV=production, so this CI placeholder passes.
          BETTER_AUTH_SECRET: ci-build-placeholder-XyZ123AbC456DeF789GhI012JkL345Mn
          BETTER_AUTH_URL: http://localhost:7070
          OWNER_EMAILS: ci@example.com
          # Rate limiting falls back to in-memory in CI (no Redis required)
          KV_REST_API_URL: ""
          KV_REST_API_TOKEN: ""
