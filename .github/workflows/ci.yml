name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Placeholder secrets: the build only needs these to exist, and no test
      # here talks to a real Supabase project.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
          BETTER_AUTH_SECRET: build-only-placeholder
          BETTER_AUTH_URL: http://localhost:7070
          OWNER_EMAILS: ci@example.com
